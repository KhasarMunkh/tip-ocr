<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Distribution Calculator</title>
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            background: #f0f1ff;
            border-color: #764ba2;
        }

        .upload-section.dragover {
            background: #e8e9ff;
            border-color: #764ba2;
        }

        #imageInput {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: scale(1.05);
        }

        #preview {
            max-width: 100%;
            max-height: 400px;
            margin: 20px auto;
            display: none;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        #progress {
            display: none;
            margin: 20px 0;
            text-align: center;
            color: #667eea;
            font-weight: bold;
        }

        .tip-input-section {
            display: none;
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .tip-input-section label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
        }

        .tip-input-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .calculate-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .calculate-btn:hover {
            transform: scale(1.02);
        }

        #results {
            display: none;
            margin-top: 30px;
        }

        .worker-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .worker-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .worker-name {
            font-weight: bold;
            color: #333;
        }

        .worker-hours {
            color: #666;
            margin-right: auto;
            margin-left: 20px;
        }

        .worker-tip {
            font-size: 20px;
            font-weight: bold;
            color: #11998e;
        }

        .total-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .total-section h3 {
            margin-bottom: 10px;
        }

        .total-amount {
            font-size: 32px;
            font-weight: bold;
        }

        .raw-text {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            display: none;
        }

        .toggle-raw {
            margin-top: 10px;
            background: #6c757d;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Tip Distribution Calculator</h1>
        <p class="subtitle">Upload a photo of your hours sheet to automatically calculate tip distribution</p>

        <div class="upload-section" id="uploadSection">
            <input type="file" id="imageInput" accept="image/*" capture="environment">
            <p style="margin-bottom: 15px; color: #666;">📸 Drag & drop your image here or click to upload</p>
            <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
                Choose Image
            </button>
        </div>

        <img id="preview" alt="Preview">
        <div id="progress"></div>

        <div class="tip-input-section" id="tipInputSection">
            <label for="totalTips">Total Tips to Distribute ($):</label>
            <input type="number" id="totalTips" step="0.01" min="0" placeholder="Enter total tips amount">
            <button class="calculate-btn" onclick="calculateTips()">Calculate Distribution</button>
        </div>

        <div id="results"></div>

        <button class="toggle-raw" id="toggleRaw" style="display: none;" onclick="toggleRawText()">
            Show Raw OCR Text
        </button>
        <div class="raw-text" id="rawText"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
